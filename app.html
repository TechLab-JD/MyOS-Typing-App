<div class="app-window" id="TypingApp">
  <div class="app-header"><span class="app-title">⌨️ Typing Test</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="ty">
      <div class="ty-stats"><span id="ty-wpm">0 wpm</span><span id="ty-acc">100%</span><span id="ty-time">0s</span><button id="ty-new">New Text</button></div>
      <div id="ty-sample" class="ty-sample"></div>
      <textarea id="ty-input" class="ty-input" placeholder="Start typing here..." spellcheck="false"></textarea>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
